name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: uv sync --frozen
      - name: Check local analytics syntax and state regressions
        run: |
          node --check site/app.js
          node tests/test_site_state.cjs
      - name: Test pipeline and public synthetic demo
        run: uv run pytest
